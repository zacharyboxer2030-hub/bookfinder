<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookFinder</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top left, #542cff, transparent 35%),
        radial-gradient(circle at bottom right, #00c6ff, transparent 35%),
        #080b18;

    display: flex;
    justify-content: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 500px;
}

.header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    font-size: 42px;
}

.title {
    font-size: 30px;
    font-weight: bold;
}

.tagline {
    color: #bfc7ff;
    margin-top: 8px;
}

.card {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.scanner {
    position: relative;
    width: 100%;
    height: 330px;
    border-radius: 20px;
    overflow: hidden;
    background: #05070d;
}

video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: black;
}

.camera-placeholder {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    color: #aeb7d9;
    padding: 30px;

    pointer-events: none;
}

.scan-box {
    position: absolute;

    left: 8%;
    right: 8%;
    top: 32%;
    bottom: 32%;

    border: 3px solid white;
    border-radius: 12px;

    pointer-events: none;

    box-shadow:
        0 0 20px rgba(0,229,255,0.8);
}

.scan-line {
    position: absolute;

    left: 8%;
    right: 8%;

    height: 3px;

    background: #00e5ff;

    box-shadow: 0 0 15px #00e5ff;

    animation: scan 2s infinite;

    pointer-events: none;
}

@keyframes scan {

    0% {
        top: 33%;
    }

    50% {
        top: 67%;
    }

    100% {
        top: 33%;
    }
}

.status {
    text-align: center;
    margin: 15px 0;
    color: #cbd3ff;
    min-height: 22px;
}

button,
.choose-photo {

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    text-align: center;

    border: none;
    border-radius: 15px;

    padding: 15px;
    margin-top: 12px;

    font-size: 16px;
    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #6a35ff,
            #00bfff
        );
}

input[type="file"] {
    display: none;
}

.result {
    margin-top: 18px;
    padding: 18px;

    border-radius: 18px;

    background: rgba(0,0,0,0.25);

    display: none;
}

.book-title {
    font-size: 22px;
    font-weight: bold;
}

.author {
    color: #c4ccff;
    margin-top: 6px;
}

.isbn {
    margin-top: 12px;
    color: #8feaff;
    font-family: monospace;
}

.price {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #6dffb2;
}

.cover {
    width: 100px;
    max-height: 145px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
}

</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">📚</div>

        <div class="title">
            BookFinder
        </div>

        <div class="tagline">
            Scan it. Find it. Buy it cheaper.
        </div>

    </div>


    <div class="card">

        <div class="scanner">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <div
                class="camera-placeholder"
                id="placeholder">

                📷
                <br><br>

                Point your camera at the
                <br>

                ISBN barcode on the back
                <br>

                of the book

            </div>

            <div class="scan-box"></div>

            <div class="scan-line"></div>

        </div>


        <div
            class="status"
            id="status">

            Press Start ISBN Scanner

        </div>


        <button id="startButton">

            📷 Start ISBN Scanner

        </button>


        <label class="choose-photo">

            🖼️ Choose a Photo

            <input
                id="photoInput"
                type="file"
                accept="image/*">

        </label>


        <div
            class="result"
            id="result">

            <img
                id="cover"
                class="cover">

            <div
                class="book-title"
                id="bookTitle">
            </div>

            <div
                class="author"
                id="author">
            </div>

            <div
                class="isbn"
                id="isbn">
            </div>

            <div
                class="price"
                id="price">
            </div>

        </div>

    </div>

</div>


<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>


<script>

let codeReader = null;
let controls = null;
let scanning = false;

const video =
    document.getElementById("video");

const statusText =
    document.getElementById("status");

const placeholder =
    document.getElementById("placeholder");

const startButton =
    document.getElementById("startButton");


/* START CAMERA */

async function startScanner() {

    if (scanning) {
        return;
    }

    try {

        statusText.textContent =
            "📷 Starting rear camera...";

        placeholder.style.display = "none";

        /*
         * Ask the phone for the rear camera.
         */

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });


        /*
         * Put the camera stream
         * directly into the video.
         */

        video.srcObject = stream;

        await video.play();


        statusText.textContent =
            "🔎 Looking for ISBN barcode...";


        /*
         * Start ZXing scanner.
         */

        codeReader =
            new ZXingBrowser.BrowserMultiFormatReader();


        scanning = true;


        controls =
            await codeReader.decodeFromVideoElement(
                video,
                (result, error) => {

                    if (!result) {
                        return;
                    }


                    const barcode =
                        result.getText();


                    console.log(
                        "Barcode detected:",
                        barcode
                    );


                    /*
                     * ISBN-13.
                     */

                    if (

                        /^[0-9]{13}$/.test(barcode)

                        &&

                        (
                            barcode.startsWith("978") ||
                            barcode.startsWith("979")
                        )

                    ) {

                        foundISBN(barcode);

                    }

                }
            );

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "❌ Camera error: " +
            error.message;

    }

}


/* STOP CAMERA */

function stopScanner() {

    if (controls) {

        controls.stop();
        controls = null;

    }


    if (codeReader) {

        codeReader.reset();

    }


    if (video.srcObject) {

        const tracks =
            video.srcObject.getTracks();

        tracks.forEach(track => {
            track.stop();
        });

        video.srcObject = null;

    }


    scanning = false;

}


/* ISBN FOUND */

async function foundISBN(isbn) {

    stopScanner();


    statusText.textContent =
        "✅ ISBN found: " + isbn;


    document
        .getElementById("result")
        .style.display = "block";


    document
        .getElementById("isbn")
        .textContent =
        "ISBN: " + isbn;


    document
        .getElementById("bookTitle")
        .textContent =
        "🔎 Finding your book...";


    document
        .getElementById("price")
        .textContent =
        "Please wait...";


    await findBook(isbn);

}


/* FIND BOOK */

async function findBook(isbn) {

    try {

        const response =
            await fetch(
                "https://openlibrary.org/isbn/" +
                isbn +
                ".json"
            );


        if (!response.ok) {

            throw new Error(
                "Book not found"
            );

        }


        const book =
            await response.json();


        document
            .getElementById("bookTitle")
            .textContent =
            book.title ||
            "Unknown title";


        if (book.publishers) {

            document
                .getElementById("author")
                .textContent =
                "Publisher: " +
                book.publishers
                    .map(p => p.name)
                    .join(", ");

        }


        const cover =
            document.getElementById("cover");


        cover.src =
            "https://covers.openlibrary.org/isbn/" +
            isbn +
            "-M.jpg";


        cover.style.display =
            "block";


        document
            .getElementById("price")
            .textContent =
            "💷 Price comparison coming next";

    }

    catch (error) {

        console.error(error);

        document
            .getElementById("bookTitle")
            .textContent =
            "Book not found";

        document
            .getElementById("price")
            .textContent =
            "Try scanning the barcode again.";

    }

}


/* START BUTTON */

startButton.addEventListener(
    "click",
    startScanner
);


/* PHOTO BUTTON */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        function() {

            if (this.files.length > 0) {

                statusText.textContent =
                    "🖼️ Photo selected.";

                alert(
                    "Photo ISBN scanning will be added next."
                );

            }

        }
    );

</script>

</body>
</html>
