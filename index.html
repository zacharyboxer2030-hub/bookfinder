<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookFinder</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top left, #542cff, transparent 35%),
        radial-gradient(circle at bottom right, #00c6ff, transparent 35%),
        #080b18;

    display: flex;
    justify-content: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 500px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    font-size: 42px;
    font-weight: bold;
}

.title {
    font-size: 30px;
    font-weight: bold;
    margin-top: 5px;
}

.tagline {
    color: #bfc7ff;
    margin-top: 8px;
}

/* MAIN CARD */

.card {
    background: rgba(255,255,255,0.09);

    border: 1px solid rgba(255,255,255,0.15);

    backdrop-filter: blur(15px);

    border-radius: 25px;

    padding: 18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
}

/* CAMERA */

.scanner {
    position: relative;

    width: 100%;
    height: 330px;

    border-radius: 20px;

    overflow: hidden;

    background: #05070d;
}

video {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.camera-placeholder {
    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: #aeb7d9;

    padding: 30px;

    pointer-events: none;
}

/* SCAN BOX */

.scan-corners {
    position: absolute;

    inset: 18%;

    border: 3px solid rgba(255,255,255,0.7);

    border-radius: 15px;

    pointer-events: none;
}

/* MOVING SCAN LINE */

.scan-line {
    position: absolute;

    left: 20%;
    right: 20%;

    height: 3px;

    background: #00e5ff;

    box-shadow:
        0 0 15px #00e5ff;

    animation: scan 2s infinite;

    pointer-events: none;
}

@keyframes scan {

    0% {
        top: 22%;
    }

    50% {
        top: 75%;
    }

    100% {
        top: 22%;
    }

}

/* STATUS */

.status {
    text-align: center;

    margin: 15px 0;

    color: #cbd3ff;

    min-height: 22px;
}

/* BUTTONS */

button,
.choose-photo {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    text-align: center;

    border: none;

    border-radius: 15px;

    padding: 15px;

    margin-top: 12px;

    font-size: 16px;

    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #6a35ff,
            #00bfff
        );

    box-shadow:
        0 8px 25px rgba(0,180,255,0.25);

    transition: 0.2s;
}

button:hover,
.choose-photo:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 30px rgba(0,180,255,0.35);
}

button:active,
.choose-photo:active {

    transform: scale(0.98);
}

/* HIDE FILE INPUT */

input[type="file"] {
    display: none;
}

/* RESULT */

.result {

    margin-top: 18px;

    padding: 18px;

    border-radius: 18px;

    background: rgba(0,0,0,0.25);

    display: none;
}

/* BOOK COVER */

.cover {

    width: 100px;

    max-height: 145px;

    object-fit: cover;

    border-radius: 8px;

    margin-bottom: 12px;

    display: none;
}

/* BOOK TITLE */

.book-title {

    font-size: 22px;

    font-weight: bold;
}

/* AUTHOR */

.author {

    color: #c4ccff;

    margin-top: 6px;
}

/* ISBN */

.isbn {

    margin-top: 12px;

    color: #8feaff;

    font-family: monospace;
}

/* PRICE */

.price {

    margin-top: 15px;

    font-size: 20px;

    font-weight: bold;

    color: #6dffb2;
}

</style>

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            📚
        </div>

        <div class="title">
            BookFinder
        </div>

        <div class="tagline">
            Scan it. Find it. Buy it cheaper.
        </div>

    </div>


    <!-- MAIN CARD -->

    <div class="card">

        <!-- CAMERA -->

        <div class="scanner">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <div
                class="camera-placeholder"
                id="placeholder">

                📷

                <br><br>

                Point your camera at the
                <br>

                barcode on the back of the book

            </div>

            <div class="scan-corners"></div>

            <div class="scan-line"></div>

        </div>


        <!-- STATUS -->

        <div
            class="status"
            id="status">

            Press Start Scanner

        </div>


        <!-- START CAMERA -->

        <button onclick="startScanner()">

            📷 Start Automatic Scanner

        </button>


        <!-- CHOOSE PHOTO -->

        <label class="choose-photo">

            🖼️ Choose a Photo

            <input
                id="photoInput"
                type="file"
                accept="image/*">

        </label>


        <!-- RESULT -->

        <div
            class="result"
            id="result">

            <img
                id="cover"
                class="cover">

            <div
                class="book-title"
                id="bookTitle">

                Book found

            </div>

            <div
                class="author"
                id="author">
            </div>

            <div
                class="isbn"
                id="isbn">
            </div>

            <div
                class="price"
                id="price">

                🔎 Looking up book...

            </div>

        </div>

    </div>

</div>


<!-- ZXING BARCODE SCANNER -->

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>


<script>

let codeReader;

let controls;

let scanning = false;


const video =
    document.getElementById("video");

const statusText =
    document.getElementById("status");

const placeholder =
    document.getElementById("placeholder");


/* START SCANNER */

async function startScanner() {

    if (scanning) {
        return;
    }

    try {

        statusText.textContent =
            "📷 Starting camera...";


        codeReader =
            new ZXingBrowser.BrowserMultiFormatReader();


        scanning = true;


        placeholder.style.display =
            "none";


        statusText.textContent =
            "🔎 Looking for the ISBN barcode...";


        controls =
            await codeReader.decodeFromVideoDevice(

                undefined,

                video,

                (result, error) => {

                    if (result) {

                        const barcode =
                            result.getText();


                        /*
                         ISBN-13 normally starts
                         with 978 or 979
                        */

                        if (

                            barcode.length === 13 &&

                            (
                                barcode.startsWith("978") ||
                                barcode.startsWith("979")
                            )

                        ) {

                            foundISBN(barcode);

                        }

                    }

                }

            );

    }

    catch (error) {

        console.error(error);


        scanning = false;


        statusText.textContent =
            "❌ Camera could not start. " +
            "Make sure you allow camera access.";

    }

}


/* STOP SCANNER */

function stopScanner() {

    if (controls) {

        controls.stop();

        controls = null;

    }


    if (codeReader) {

        codeReader.reset();

    }


    scanning = false;

}


/* ISBN FOUND */

async function foundISBN(isbn) {

    if (!scanning) {
        return;
    }


    stopScanner();


    statusText.textContent =
        "✅ ISBN found: " + isbn;


    document
        .getElementById("result")
        .style.display = "block";


    document
        .getElementById("isbn")
        .textContent =
        "ISBN: " + isbn;


    document
        .getElementById("bookTitle")
        .textContent =
        "🔎 Finding your book...";


    document
        .getElementById("author")
        .textContent = "";


    document
        .getElementById("price")
        .textContent =
        "Please wait...";


    await findBook(isbn);

}


/* FIND BOOK */

async function findBook(isbn) {

    try {

        const response =
            await fetch(

                "https://openlibrary.org/isbn/" +
                isbn +
                ".json"

            );


        if (!response.ok) {

            throw new Error(
                "Book not found"
            );

        }


        const book =
            await response.json();


        /* TITLE */

        document
            .getElementById("bookTitle")
            .textContent =
            book.title ||
            "Unknown title";


        /* PUBLISHER */

        if (book.publishers) {

            document
                .getElementById("author")
                .textContent =
                "Publisher: " +
                book.publishers
                    .map(p => p.name)
                    .join(", ");

        }


        /* COVER */

        const cover =
            document.getElementById("cover");


        cover.src =
            "https://covers.openlibrary.org/isbn/" +
            isbn +
            "-M.jpg";


        cover.style.display =
            "block";


        /* PRICE */

        document
            .getElementById("price")
            .textContent =
            "💷 Price comparison coming next";

    }

    catch (error) {

        console.error(error);


        document
            .getElementById("bookTitle")
            .textContent =
            "Book not found";


        document
            .getElementById("price")
            .textContent =
            "Try scanning the barcode again.";

    }

}


/* PHOTO BUTTON */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        function() {

            if (this.files.length > 0) {

                statusText.textContent =
                    "🖼️ Photo selected.";

                alert(
                    "Photo scanning will be added next. " +
                    "For now, use the automatic camera scanner."
                );

            }

        }
    );

</script>

</body>
</html>
