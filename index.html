<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookFinder</title>

<!-- ISBN / barcode scanner -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top left, #5b21b6 0%, transparent 35%),
        radial-gradient(circle at bottom right, #2563eb 0%, transparent 35%),
        #090914;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 500px;
    margin: auto;
}

.header {
    text-align: center;
    padding: 20px 10px;
}

.logo {
    font-size: 55px;
    margin-bottom: 5px;
}

.title {
    font-size: 38px;
    font-weight: 800;
    margin: 0;
}

.tagline {
    color: #bfc3ff;
    margin-top: 8px;
    font-size: 15px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.scanner-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.scanner {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: #000;
    min-height: 300px;
}

#reader {
    width: 100%;
}

#reader video {
    width: 100% !important;
    height: 300px !important;
    object-fit: cover;
    border-radius: 18px;
}

.scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.scan-box {
    width: 82%;
    height: 105px;
    border: 3px solid white;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
}

.scan-line {
    position: absolute;
    width: 78%;
    height: 3px;
    background: #00eaff;
    box-shadow: 0 0 15px #00eaff;
    animation: scan 2s infinite;
}

@keyframes scan {
    0% {
        transform: translateY(-45px);
    }
    50% {
        transform: translateY(45px);
    }
    100% {
        transform: translateY(-45px);
    }
}

.status {
    text-align: center;
    margin: 15px 0;
    color: #cfd2ff;
    min-height: 22px;
}

button,
.choose-photo {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    text-align: center;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    box-shadow: 0 10px 25px rgba(37,99,235,0.3);
    margin-top: 10px;
}

button:hover,
.choose-photo:hover {
    transform: translateY(-1px);
}

input[type="file"] {
    display: none;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
}

.book-cover {
    width: 130px;
    max-height: 190px;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.book-title {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
}

.author {
    text-align: center;
    color: #c8caff;
    margin-top: 6px;
}

.isbn {
    text-align: center;
    color: #8eeaff;
    margin-top: 12px;
    font-size: 14px;
}

.message {
    text-align: center;
    color: #ffb4b4;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">📚</div>
        <h1 class="title">BookFinder</h1>
        <div class="tagline">
            Scan a book's ISBN and find it
        </div>
    </div>

    <div class="card">

        <div class="scanner-title">
            📷 Scan ISBN Barcode
        </div>

        <div class="scanner">
            <div id="reader"></div>

            <div class="scan-overlay">
                <div class="scan-box"></div>
                <div class="scan-line"></div>
            </div>
        </div>

        <div class="status" id="status">
            Point your camera at the ISBN barcode
        </div>

        <button onclick="startCamera()">
            📷 Scan with Camera
        </button>

        <label class="choose-photo">
            🖼️ Choose Photo
            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >
        </label>

        <div class="result" id="result">

            <img
                id="cover"
                class="book-cover"
                src=""
                alt="Book cover"
            >

            <div class="book-title" id="bookTitle"></div>

            <div class="author" id="author"></div>

            <div class="isbn" id="isbn"></div>

        </div>

        <div class="message" id="message"></div>

    </div>

</div>

<script>

let scanner = null;
let scanning = false;
let lastISBN = "";

/*
    ONLY look for EAN-13.
    ISBN-13 books normally use an EAN-13 barcode
    beginning with 978 or 979.
*/

const isbnFormats = [
    Html5QrcodeSupportedFormats.EAN_13
];

async function startCamera() {

    if (scanning) {
        return;
    }

    document.getElementById("status").textContent =
        "Starting camera...";

    document.getElementById("message").textContent = "";

    try {

        scanner = new Html5Qrcode("reader", {
            formatsToSupport: isbnFormats
        });

        scanning = true;

        await scanner.start(
            {
                facingMode: "environment"
            },
            {
                fps: 10,
                qrbox: {
                    width: 330,
                    height: 120
                }
            },
            function(decodedText) {

                handleBarcode(decodedText);

            },
            function(errorMessage) {

                // Ignore normal "nothing found" messages.
            }
        );

        document.getElementById("status").textContent =
            "Point the camera at the ISBN barcode";

    } catch (error) {

        scanning = false;

        document.getElementById("status").textContent =
            "Camera could not start.";

        document.getElementById("message").textContent =
            error;

        console.error(error);
    }
}


/*
    PHOTO SCANNING
*/

document
    .getElementById("photoInput")
    .addEventListener("change", async function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        document.getElementById("status").textContent =
            "Scanning photo for ISBN...";

        document.getElementById("message").textContent = "";

        try {

            /*
                Camera scanning and photo scanning cannot
                run at the same time, so stop the camera first.
            */

            if (scanning && scanner) {
                await stopCamera();
            }

            const photoScanner = new Html5Qrcode("reader", {
                formatsToSupport: isbnFormats
            });

            const decodedText =
                await photoScanner.scanFile(file, false);

            await photoScanner.clear();

            handleBarcode(decodedText);

        } catch (error) {

            document.getElementById("status").textContent =
                "I couldn't find an ISBN barcode in that photo.";

            document.getElementById("message").textContent =
                "Try taking a clearer photo of the barcode.";

            console.error(error);
        }

        /*
            Allow the same photo to be selected again.
        */
        event.target.value = "";
    });


/*
    CHECK THAT THE BARCODE IS ACTUALLY AN ISBN
*/

function handleBarcode(barcode) {

    barcode = String(barcode).replace(/\D/g, "");

    console.log("Barcode detected:", barcode);

    if (
        barcode.length === 13 &&
        (barcode.startsWith("978") ||
         barcode.startsWith("979"))
    ) {

        lastISBN = barcode;

        document.getElementById("status").textContent =
            "ISBN found!";

        showBook(barcode);

        stopCamera();

    } else {

        document.getElementById("status").textContent =
            "Barcode found, but it doesn't appear to be an ISBN.";

    }
}


/*
    LOOK UP THE BOOK USING OPEN LIBRARY
*/

async function showBook(isbn) {

    const result = document.getElementById("result");
    const title = document.getElementById("bookTitle");
    const author = document.getElementById("author");
    const isbnText = document.getElementById("isbn");
    const cover = document.getElementById("cover");

    result.style.display = "block";

    title.textContent = "Finding book...";
    author.textContent = "";
    isbnText.textContent = "ISBN: " + isbn;

    cover.style.display = "none";

    try {

        const response = await fetch(
            "https://openlibrary.org/isbn/" +
            isbn +
            ".json"
        );

        if (!response.ok) {
            throw new Error("Book not found");
        }

        const book = await response.json();

        title.textContent =
            book.title || "Unknown book";

        if (book.authors && book.authors.length > 0) {

            const authorNames = [];

            for (const item of book.authors) {

                if (item.key) {

                    try {

                        const authorResponse =
                            await fetch(
                                "https://openlibrary.org" +
                                item.key +
                                ".json"
                            );

                        const authorData =
                            await authorResponse.json();

                        if (authorData.name) {
                            authorNames.push(
                                authorData.name
                            );
                        }

                    } catch (e) {
                        // Ignore author lookup errors.
                    }
                }
            }

            author.textContent =
                authorNames.join(", ");
        }

        cover.src =
            "https://covers.openlibrary.org/isbn/" +
            isbn +
            "-M.jpg";

        cover.onload = function() {
            cover.style.display = "block";
        };

        cover.onerror = function() {
            cover.style.display = "none";
        };

        document.getElementById("status").textContent =
            "Book found!";

    } catch (error) {

        title.textContent = "Book not found";

        author.textContent =
            "ISBN detected: " + isbn;

        document.getElementById("status").textContent =
            "ISBN found, but book information wasn't found.";

        console.error(error);
    }
}


/*
    STOP CAMERA
*/

async function stopCamera() {

    if (scanner && scanning) {

        try {
            await scanner.stop();
        } catch (error) {
            console.log(error);
        }

        try {
            await scanner.clear();
        } catch (error) {
            console.log(error);
        }
    }

    scanner = null;
    scanning = false;
}

</script>

</body>
</html>
